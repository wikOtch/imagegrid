name: Image Grid
description: Display image grid.
type: particle
icon: fa-picture-o

configuration:
  caching:
    type: static

form:
  overrideable: false
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Globally enable particle.
      default: true

    class:
      type: input.selectize
      label: CSS Classes
      description: CSS class name for the particle.

    title:
      type: input.text
      label: Title
      description: Customize the title text.
      placeholder: Enter title

    desc:
      type: textarea.textarea
      label: Description
      description: Customize the description.
      placeholder: Enter short description

    cols:
      type: select.select
      label: Grid Column
      description: Select the grid column amount
      placeholder: 'Select...'
      options:
        g-imagegrid-2cols: 2 Columns
        g-imagegrid-3cols: 3 Columns
        g-imagegrid-4cols: 4 Columns
        g-imagegrid-5cols: 5 Columns

    layout:
      type: select.select
      label: Layout
      description: Select preferred layout
      placeholder: 'Select...'
      options:
        g-imagegrid-standard: Standard
        g-imagegrid-captions: Visible captions

    album:
      type: input.text
      label: Album Name
      description: Customize the album name.
      placeholder: Enter album name

    filter:
      type: input.checkbox
      label: Tag Filter
      description: Display a button for each tag above the grid to show only the matching images.
      default: true

    filterall:
      type: input.text
      label: All Button Text
      description: Text of the button that shows every image.
      placeholder: Tous
      default: Tous

    search:
      type: input.checkbox
      label: Tag Search
      description: Display a search field to filter the images by tag.
      default: false

    searchplaceholder:
      type: input.text
      label: Search Placeholder
      description: Placeholder text of the tag search field.
      placeholder: Rechercher un tag…
      default: Rechercher un tag…

    emptytext:
      type: input.text
      label: No Result Text
      description: Text displayed when no image matches the selected tag.
      placeholder: Aucune image ne correspond à ce tag.
      default: Aucune image ne correspond à ce tag.

    filmyearlabel:
      type: input.text
      label: Year Label
      description: Label of the film year in the film details shown with the enlarged image.
      placeholder: Année
      default: Année

    filmdirectorlabel:
      type: input.text
      label: Director Label
      description: Label of the film director in the film details shown with the enlarged image.
      placeholder: Réalisateur
      default: Réalisateur

    filmproductionlabel:
      type: input.text
      label: Production Label
      description: Label of the film production in the film details shown with the enlarged image.
      placeholder: Production
      default: Production

    filmfestivallabel:
      type: input.text
      label: Festival Label
      description: Label of the film festivals in the film details shown with the enlarged image.
      placeholder: Festival
      default: Festival

    imagegriditems:
      type: collection.list
      array: true
      label: Images
      description: Create each item to appear in the content row.
      value: caption
      ajax: true

      fields:
        .image:
          type: input.imagepicker
          label: Promo Image
          description: Select desired promo image.
        .caption:
          type: input.text
          label: Caption
          description: Customize the image caption.
          placeholder: Enter caption
        .alt:
          type: input.text
          label: Alternative Text
          description: Describe the image (alt attribute). Also shown as the title of the enlarged image in the lightbox. Defaults to the caption when empty.
          placeholder: Enter alternative text
        .tags:
          type: input.text
          label: Tags
          description: Comma-separated list of tags (e.g. nature, montagne).
          placeholder: tag1, tag2
        .filmtitle:
          type: input.text
          label: Film Title
          description: Title of the film, shown next to the enlarged image. Leave the film fields empty for an image without film details.
          placeholder: Enter film title
        .filmyear:
          type: input.text
          label: Year
          description: Year of the film (e.g. 2024).
          placeholder: '2024'
        .filmdirector:
          type: input.text
          label: Director
          description: Director(s) of the film.
          placeholder: Enter director
        .filmproduction:
          type: input.text
          label: Production
          description: Production company or companies of the film.
          placeholder: Enter production
        .filmfestival:
          type: textarea.textarea
          label: Festival
          description: Festivals and awards, one per line.
          placeholder: Enter festivals, one per line
